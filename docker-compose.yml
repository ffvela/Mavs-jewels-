# Entorno local de desarrollo. Uso: docker compose up -d  →  http://localhost:8080
services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: mavs_jewelry
      MARIADB_USER: mavs
      MARIADB_PASSWORD: mavs_local
      MARIADB_ROOT_PASSWORD: root_local
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - datos_mysql:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  datos_mysql:
